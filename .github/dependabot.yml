version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 20
    registries: '*'
    ignore:
      - dependency-name: 'eslint'
        versions: ['9.x']
      # @types/fhir's 3.0.x line is a dead 2020 branch scoped to FHIR R3 only (no `fhir/r4`
      # entry point). The maintained line is 0.0.x, which npm tags as `latest` and is what
      # this repo imports from (`fhir/r4`). Dependabot reads 3.0.2 > 0.0.44 by semver and
      # reopens this every month, so it needs an explicit ignore.
      - dependency-name: '@types/fhir'
        versions: ['>=1.0.0']
    groups:
      react-dependencies:
        patterns:
          - 'clsx'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      security:
        patterns:
          - 'jose'
      styling:
        patterns:
          - 'pino'
          - 'oxfmt'
          - 'oxlint'
          - 'tailwindcss'
          - '@tailwindcss/postcss'
      next:
        patterns:
          - 'next'
          - 'next-logger'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
      language:
        patterns:
          - 'typescript'
      utils:
        patterns:
          - 'zod'