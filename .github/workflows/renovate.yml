# Self-hosted Renovate. Runs as an Action rather than relying on the Renovate
# GitHub App being installed on the organisation.
name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        default: info
        type: choice
        options: [debug, info, warn]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: renovatebot/github-action@v43
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
