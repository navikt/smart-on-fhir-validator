# Proves the app on Node versions we have not adopted yet, so a major bump is a
# known quantity before Renovate proposes it rather than a surprise afterwards.
# Scheduled only — this proves a *future* Node major, not something every PR should
# pay for. Use workflow_dispatch to run it on demand (e.g. right after bumping .nvmrc
# or the Dockerfile base image, to double-check before merging).
name: Node compatibility

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: node-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 24 is already proven daily by ci.yml on every PR — it is included here too as
          # a control, not for redundant coverage. This job's own setup differs from ci.yml's
          # (different install flags, matrix, its own artifact naming), so without a known-good
          # entry a red node:26 run would be ambiguous: is Node 26 actually incompatible, or is
          # this workflow itself broken? (The immutable+update-lockfile bug fixed alongside this
          # comment is exactly that failure mode — it would have silently broken every entry,
          # 24 included, and gone unnoticed for a week because nothing else in the matrix could
          # tell the difference.) A green node:24 next to a red node:26 pins the failure to 26.
          - node: 24
            experimental: false
          - node: 26
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn workspace e2e run tsc
      - run: yarn test:coverage
      - run: yarn build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn e2e:install
      - run: yarn e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: e2e/playwright-report/
          retention-days: 7
