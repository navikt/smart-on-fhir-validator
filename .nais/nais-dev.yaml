apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nav-smart-on-fhir-validator
  namespace: helseopplysninger
  labels:
    team: helseopplysninger
spec:
  image: {{ image }}

  port: 3000
  replicas:
    max: 2
    min: 1
    cpuThresholdPercentage: 90
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 256Mi

  liveness:
    path: /api/internal/is_alive
  readiness:
    path: /api/internal/is_ready
  preStopHook:
    http:
      path: /api/internal/pre_stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
  ingresses:
    - "https://nav-on-fhir.ekstern.dev.nav.no"

  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache

  accessPolicy:
    inbound:
      rules:
        - application: zara
          namespace: tsm
    outbound:
      external:
        - host: "api.dips.no"
        - host: "fhirapi.public.webmedepj.no"
        - host: "launch.smarthealthit.org"
        - host: "epj.ekstern.dev.nav.no"

  envFrom:
    - secret: smart-on-fhir-validator-clients

  env:
    - name: NEXT_PUBLIC_ENVIRONMENT
      value: dev
    # One entry per vendor that authenticates with a static client (public/PKCE,
    # client_secret_basic/post, or private_key_jwt). No entry needed if your authorization server
    # supports dynamic client registration (RFC 7591) instead — see README §4. Every field here is
    # a name or public identifier, never a secret; a symmetric entry's actual secret lives in the
    # smart-on-fhir-validator-clients Kubernetes secret, referenced here only by env var name.
    #
    # To add your EHR: open a pull request that turns the empty array below into a one-element
    # array containing your entry, for example:
    #   [{ "name": "Acme EHR", "issuer": "https://acme.example.com", "clientId": "abc123",
    #      "authType": "asymmetric" }]
    # If entries already exist, add a comma and your object before the closing "]". Keep the
    # result valid JSON — no comments inside the block below, since it becomes the literal value.
    - name: SMART_ISSUERS
      value: |
        []
