apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: {{ team }}
  name: {{ app }}
  namespace: {{ namespace }}
spec:
  image: {{ image }}
  port: 3000
  # SMART sessions hold PKCE verifiers, tokens and dynamically registered client
  # credentials. They must outlive a pod restart and be shared across replicas.
  # The instance name must match the Valkey resource in .nais/valkey.yaml,
  # which nais names `valkey-<team>-<instance>`.
  valkey:
    - instance: {{ app }}
      access: readwrite
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
  ingresses:
  {{#each ingresses as |url|}}
    - {{ url }}
  {{/each}}
  liveness:
    path: /api/internal/is_alive
  readiness:
    path: /api/internal/is_ready
  preStopHook:
    http:
      path: /api/internal/pre_stop
  # Next.js writes its incremental cache to disk; the nais root filesystem is read-only.
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  replicas:
    max: 2
    min: 1
  accessPolicy:
    outbound:
      external:
      {{#each externalHosts as |host|}}
        - host: {{ host }}
      {{/each}}
  env:
    - name: NEXT_PUBLIC_ENVIRONMENT
      value: {{ environment }}
  envFrom:
    - secret: smart-on-fhir-validator-clients
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 256Mi
